[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorai"
version = "0.1.0"
description = "Local-first AI finishing and color-QC assistant for professionally finished video."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ColorAI" }]
dependencies = [
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.9,<6",
    "pydantic>=2.6,<3",
    "pillow>=10,<12",
    "scenedetect>=0.7,<1",
    "scipy>=1.11,<2",
    "tqdm>=4.66",
    "rich>=13",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]
face = [
    "mediapipe>=0.10.14,<1",
]
agent = [
    "mcp>=1.2,<2",
]

[project.scripts]
colorai = "colorai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colorai = [
    "alembic.ini",
    "templates/*.html",
    "models/*.onnx",
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
